[package]
name = "madi-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "http2", "system-proxy"] }
madi-core = { path = "../madi-core" }
madi-protocol = { path = "../madi-protocol" }
tokio = { version = "=1.54.1", features = ["process", "io-util", "fs", "sync", "time", "rt", "macros"] }
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSAppearance", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow", "NSAlert", "NSButton", "NSControl", "NSTextField", "NSView", "NSPasteboard", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSFontDescriptor", "objc2-core-foundation", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSProcessInfo", "NSByteCountFormatter", "NSFormatter", "NSData", "NSDictionary", "NSGeometry", "NSFileManager", "NSError", "NSValue", "NSDate", "NSCalendar", "NSTimeZone", "NSUserDefaults", "NSPathUtilities", "NSJSONSerialization", "NSNull", "NSNumberFormatter"] }
objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }
objc2-core-audio = { version = "=0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFString"] }
