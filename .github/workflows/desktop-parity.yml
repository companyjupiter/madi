name: Desktop migration checks
on:
  push:
    branches: [codex/tauri-ui-parity]
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'Cargo.*'
      - '.gitattributes'
      - 'rust-toolchain.toml'
      - 'scripts/*parity.py'
      - 'scripts/prepare_desktop_native.mjs'
      - 'scripts/prepare_desktop_runtime.mjs'
      - 'scripts/sync_desktop_resources.py'
      - 'engine/**'
      - 'apps/macos/scripts/build_engine.sh'
      - 'tests/parity/**'
      - 'apps/macos/Sovereign/Engine/TranslateStreamParser.swift'
      - 'apps/macos/Sovereign/Engine/EngineProtocol.swift'
      - 'apps/macos/Sovereign/Engine/EngineEvents.swift'
      - 'apps/macos/Sovereign/Engine/EngineProcess.swift'
      - 'apps/macos/Sovereign/Engine/EnginePathPolicy.swift'
      - 'apps/macos/Sovereign/Transcript/**'
      - 'apps/macos/Sovereign/Audio/AudioDevices.swift'
      - 'apps/macos/Sovereign/Audio/AudioDecode.swift'
      - 'apps/macos/Sovereign/Audio/Resampler.swift'
      - 'apps/macos/Sovereign/Audio/WavWriter.swift'
      - 'apps/macos/Tests/AudioDecodeLimitTests.swift'
      - 'apps/macos/Sovereign/UI/ContentView.swift'
      - 'apps/macos/Sovereign/UI/L10n.swift'
      - 'apps/macos/Sovereign/UI/SettingsView.swift'
      - 'apps/macos/Sovereign/UI/ClinicDisplaySupport.swift'
      - 'apps/macos/Sovereign/UI/GlossarySettingsView.swift'
      - 'apps/macos/Sovereign/SovereignApp.swift'
      - 'apps/macos/Sovereign/Audio/AudioSource.swift'
      - 'apps/macos/Sovereign/SessionController.swift'
      - 'apps/macos/Sovereign/Session/SessionArchiveWriter.swift'
      - 'apps/macos/Sovereign/Model/AssetManifest.swift'
      - 'apps/macos/Sovereign/AppInfo/FirstRunModelSetupPolicy.swift'
      - 'apps/macos/Sovereign/UI/ModelGateView.swift'
      - 'apps/macos/Sovereign/UI/WorkspaceExplorer.swift'
      - 'apps/macos/Sovereign/UI/WorkspaceStatsView.swift'
      - 'apps/macos/Sovereign/Model/WorkspaceTree.swift'
      - 'apps/macos/Sovereign/Model/ModelDownloader.swift'
      - 'apps/macos/Sovereign/Model/TranslateModelDownloader.swift'
      - 'web/fixtures/*.events.jsonl'
      - 'design/parity/*reference.json'
      - '.github/workflows/desktop-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Fail at the first failing native command on Windows as well as macOS.
    shell: bash

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install pinned Rust components
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Prepare original macOS inference build inputs
        if: runner.os == 'macOS'
        run: |
          [ "$(uname -m)" = arm64 ] || { echo 'Apple Silicon runner required' >&2; exit 1; }
          curl --fail --location --retry 3 https://ziglang.org/download/0.14.1/zig-aarch64-macos-0.14.1.tar.xz --output "$RUNNER_TEMP/madi-zig.tar.xz"
          echo "39f3dc5e79c22088ce878edc821dedb4ca5a1cd9f5ef915e9b3cc3053e8faefa  $RUNNER_TEMP/madi-zig.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/madi-zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-0.14.1" >> "$GITHUB_PATH"
          apps/macos/scripts/fetch_runtime_assets.sh
      - name: Build the local frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run prepare-native
          npm run build
      - name: Check formatting and shared behavior
        run: |
          python scripts/sync_desktop_resources.py
          git diff --exit-code -- apps/desktop/public/assets apps/desktop/src/strings.generated.json apps/desktop/src/model-strings.generated.json design/parity/asset-reference.json
          cargo fmt --all --check
          cargo test --locked -p madi-core -p madi-protocol -p madi-platform
          cargo clippy --locked --workspace --all-targets -- -D warnings
          node --test tests/parity/setup_intent_queue.test.mjs
      - name: Compare against the shipping Swift parser
        if: runner.os == 'macOS'
        run: |
          python3 scripts/check_translate_parser_parity.py
          python3 scripts/check_transcribe_parser_parity.py
          python3 scripts/check_structured_parser_parity.py
          python3 scripts/check_stream_process_parity.py
          python3 scripts/check_audio_devices_parity.py
          python3 scripts/check_media_file_parity.py
          python3 scripts/check_asr_config_parity.py
          python3 scripts/check_preferences_parity.py
          python3 scripts/check_glossary_parity.py
          python3 scripts/check_personal_vocabulary_parity.py
          python3 scripts/check_asset_manifest_parity.py
          python3 scripts/check_model_setup_parity.py
          python3 scripts/check_model_gate_parity.py
          python3 scripts/check_model_presentation_parity.py
          python3 scripts/check_word_merger_parity.py
          python3 scripts/check_transcript_store_parity.py
          python3 scripts/check_transcript_follow_parity.py
          python3 scripts/check_archive_parity.py
          python3 scripts/check_archive_writer_parity.py
          python3 scripts/check_workspace_parity.py
          python3 scripts/check_export_parity.py
          swiftc -parse-as-library apps/macos/Sovereign/Audio/AudioDecode.swift apps/macos/Sovereign/Audio/Resampler.swift apps/macos/Sovereign/Audio/WavWriter.swift apps/macos/Tests/AudioDecodeLimitTests.swift -o "$RUNNER_TEMP/madi-audio-decode-parity"
          "$RUNNER_TEMP/madi-audio-decode-parity"
      - name: Compare Windows parser to pinned Swift reference
        if: runner.os == 'Windows'
        run: |
          python scripts/check_translate_parser_parity.py --rust-only
          python scripts/check_transcribe_parser_parity.py --rust-only
          python scripts/check_structured_parser_parity.py --rust-only
          python scripts/check_stream_process_parity.py --rust-only
          python scripts/check_asr_config_parity.py --rust-only
          python scripts/check_preferences_parity.py --rust-only
          python scripts/check_glossary_parity.py --rust-only
          python scripts/check_personal_vocabulary_parity.py --rust-only
          python scripts/check_asset_manifest_parity.py --rust-only
          python scripts/check_model_setup_parity.py --rust-only
          python scripts/check_model_gate_parity.py --rust-only
          python scripts/check_word_merger_parity.py --rust-only
          python scripts/check_transcript_store_parity.py --rust-only
          python scripts/check_transcript_follow_parity.py --frontend-only
          python scripts/check_archive_parity.py --rust-only
          python scripts/check_archive_writer_parity.py --rust-only
          python scripts/check_export_parity.py --rust-only
      - name: Build the standalone debug parity host
        run: cargo build --locked -p madi-desktop --features custom-protocol
      - name: Verify the relocated macOS app and native decoder
        if: runner.os == 'macOS'
        run: |
          npm --prefix apps/desktop run tauri build -- --debug --bundles app
          python3 scripts/check_desktop_package_parity.py 'target/debug/bundle/macos/Madi UI Parity.app'
      - name: Record build provenance
        run: python scripts/record_desktop_build.py
      - name: Preserve evidence and experimental executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-parity-${{ matrix.os }}
          path: |
            out/desktop-build/report.json
            out/desktop-build/source.diff
            out/translate-parser-parity/report.json
            out/transcribe-parser-parity/report.json
            out/structured-parser-parity/report.json
            out/stream-process-parity/report.json
            out/audio-devices-parity/report.json
            out/media-file-parity/report.json
            out/asr-config-parity/report.json
            out/preferences-parity/report.json
            out/glossary-parity/report.json
            out/personal-vocabulary-parity/report.json
            out/asset-manifest-parity/report.json
            out/model-setup-parity/report.json
            out/model-gate-parity/report.json
            out/model-presentation-parity/report.json
            out/word-merger-parity/report.json
            out/transcript-store-parity/report.json
            out/transcript-follow-parity/report.json
            out/archive-parity/report.json
            out/archive-writer-parity/report.json
            out/workspace-parity/report.json
            out/export-parity/report.json
            out/desktop-package/report.json
            out/desktop-package/Madi-UI-Parity.app.zip
            target/debug/madi-desktop
            target/debug/madi-desktop.exe
            target/debug/madi-audio-decode
            out/desktop-native/*.json
          if-no-files-found: error
          retention-days: 14
