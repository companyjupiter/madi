name: CI

# Automatic checks are paused while the GitHub Actions account is over its
# included plan. Run the macOS release gates through madi_release.sh.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lint:
    name: Source lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')

      - name: Test S3 release publication
        shell: bash
        run: apps/macos/scripts/tests/publish_s3_release_test.sh

      - name: Test local release CLI
        shell: bash
        run: apps/macos/scripts/tests/madi_release_test.sh

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import pathlib
          import subprocess

          for path in subprocess.check_output(["git", "ls-files", "*.py"], text=True).splitlines():
              ast.parse(pathlib.Path(path).read_text(), filename=path)
          PY

  dashboard:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint dashboard
        run: npm run lint

      - name: Build dashboard
        run: npm run build

  swift-tests:
    name: Swift core tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run SovereignCore test suite
        run: swift test
