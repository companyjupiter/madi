name: CI

# Pushes to main, every pull request (forks included — no secrets are used), and
# on demand. The macOS release gates stay in madi_release.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source-lint:
    name: Source lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify canonical version mirrors
        run: apps/macos/scripts/check_version_consistency.sh

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')

      - name: Test S3 release publication
        shell: bash
        run: apps/macos/scripts/tests/publish_s3_release_test.sh

      - name: Test local release CLI
        shell: bash
        run: apps/macos/scripts/tests/madi_release_test.sh

      - name: Test Homebrew Cask updater
        shell: bash
        run: apps/macos/scripts/tests/update_homebrew_cask_test.sh

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import pathlib
          import subprocess

          for path in subprocess.check_output(["git", "ls-files", "*.py"], text=True).splitlines():
              ast.parse(pathlib.Path(path).read_text(), filename=path)
          PY

  dashboard:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint dashboard
        run: npm run lint

      - name: Build dashboard
        run: npm run build

  swift-tests:
    name: Swift core tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run SovereignCore test suite
        run: swift test

  source-only-app:
    name: Source-only app bundle
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Zig 0.14.1
        shell: bash
        run: |
          set -euo pipefail
          [ "$(uname -m)" = arm64 ] || { echo "arm64 runner required" >&2; exit 1; }
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.1/zig-aarch64-macos-0.14.1.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-0.14.1" >> "$GITHUB_PATH"

      - name: Fetch verified runtime assets
        run: apps/macos/scripts/fetch_runtime_assets.sh

      - name: Build and verify source-only bundle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/madi-source-only"
          MADI_BUNDLE_TRANSLATE_ENGINES=0 SPARKLE_ENABLED=0 STRICT_ASSETS=1 \
            apps/macos/scripts/make_app.sh "$out"
          version="$(/usr/libexec/PlistBuddy -c 'Print :MADIFullVersion' "$out/Madi.app/Contents/Info.plist")"
          apps/macos/scripts/verify_release_bundle.sh "$out/Madi.app" "$version" absent
