[workspace]
members = ["crates/madi-protocol", "crates/madi-core", "crates/madi-platform", "apps/desktop/src-tauri"]
default-members = ["crates/madi-protocol", "crates/madi-core"]
exclude = ["vendor/glib", "tests/security/glib-variant"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"

# GTK3 still requires glib 0.18. Backport the upstream VariantStrIter fix;
# scripts/check_glib_backport.py verifies the complete crate and exact delta.
[patch.crates-io]
glib = { path = "vendor/glib" }
