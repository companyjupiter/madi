<svg width="720" height="480" viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="SF Pro Text, -apple-system, Helvetica">
  <!-- Screen: first-run model download gate. Values from design/tokens.json -->
  <g id="window">
    <rect id="window-bg" width="720" height="480" rx="10" fill="#ECECEC"/>
    <g id="titlebar">
      <rect width="720" height="28" rx="10" fill="#E0E0E0"/>
      <rect y="14" width="720" height="14" fill="#E0E0E0"/>
      <circle id="traffic-close" cx="20" cy="14" r="6" fill="#FF5F57"/>
      <circle id="traffic-min" cx="40" cy="14" r="6" fill="#FEBC2E"/>
      <circle id="traffic-zoom" cx="60" cy="14" r="6" fill="#28C840"/>
      <text id="window-title" x="360" y="18" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3C43" opacity="0.85">Madi</text>
    </g>
    <rect id="content-bg" x="0" y="28" width="720" height="452" fill="#FFFFFF"/>

    <g id="gate-content">
      <g id="gate-icon">
        <circle cx="360" cy="170" r="24" fill="none" stroke="#007AFF" stroke-width="2"/>
        <path d="M348 170 l3 -8 l3 16 l3 -22 l3 28 l3 -22 l3 16 l3 -8" fill="none" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text id="app-title" x="360" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#000000" opacity="0.85">Madi</text>

      <g id="download-progress">
        <text id="progress-label" x="200" y="262" font-size="12" fill="#000000" opacity="0.85">Downloading model (38%)</text>
        <rect id="progress-track" x="200" y="272" width="320" height="6" rx="3" fill="#000000" opacity="0.10"/>
        <rect id="progress-fill" x="200" y="272" width="122" height="6" rx="3" fill="#007AFF"/>
        <text id="size-caption" x="360" y="298" text-anchor="middle" font-size="10" fill="#3C3C43" opacity="0.60">~1.5 GB · one time</text>
      </g>

      <g id="cancel-button">
        <rect x="330" y="312" width="60" height="22" rx="6" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.15"/>
        <text x="360" y="327" text-anchor="middle" font-size="12" fill="#000000" opacity="0.85">Cancel</text>
      </g>
    </g>
  </g>
</svg>
